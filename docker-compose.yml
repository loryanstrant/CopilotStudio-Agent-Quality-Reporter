# Production stack.
#
# Runs prebuilt images with no bind mounts and no auto-reload. The API image
# bakes the built SPA in and serves it directly, so production has no separate
# frontend service and no web port — the dashboard is on ${API_PORT}.
#
# For local development, layer the dev override on top:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# Host ports are unique per solution so all four can run side by side.
# This one: Postgres 5434, API 8002. See .env.example.

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agentquality}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentquality}
      POSTGRES_DB: ${POSTGRES_DB:-agentquality}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agentquality} -d ${POSTGRES_DB:-agentquality}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    # Defaults to the public GHCR image. Override API_IMAGE to run an image
    # built elsewhere, or build locally with `docker compose build`.
    image: ${API_IMAGE:-ghcr.io/loryanstrant/agentqualityreporter/api:latest}
    build:
      context: .
      target: api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://agentquality:agentquality@db:5432/agentquality}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-8002}:8000"

  worker:
    image: ${WORKER_IMAGE:-ghcr.io/loryanstrant/agentqualityreporter/worker:latest}
    build:
      context: .
      target: worker
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://agentquality:agentquality@db:5432/agentquality}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
